name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy manually from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # never stop a deploy halfway through

permissions:
  contents: read
  id-token: write # required for OIDC login to Azure

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    env:
      IMAGE: comp4350acr.azurecr.io/comp4350-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name comp4350acr
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name comp4350-frontend \
            --resource-group comp4350-rg \
            --image "$IMAGE"
