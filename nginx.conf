server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # forward API calls to the deployed backend so frontend can continue to use the relative /api/ urls
  location /api/ {
    proxy_pass https://comp4350-api.proudmoss-9dbb54ec.westus.azurecontainerapps.io;
    proxy_set_header Host comp4350-api.proudmoss-9dbb54ec.westus.azurecontainerapps.io;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}